# Scan with Draugr and publish findings to code scanning via the native `github` publisher.
name: Draugr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # lets the Saga's `github` publisher upload SARIF to code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provision the scanners the Saga's controls need (Trivy, Gitleaks, Semgrep).
      - uses: aquasecurity/setup-trivy@v0.3.1
      - run: pipx install semgrep
      - run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Draugr scan + publish
        uses: draugr-dev/draugr@v0 # pin a released version in real use
        with:
          saga: draugr.saga.yaml
          # fail-on: error   # uncomment to gate the build on findings

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draugr-reports
          path: draugr-out/
