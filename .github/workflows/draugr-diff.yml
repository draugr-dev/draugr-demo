# Post a Draugr security diff (new / fixed findings) as a sticky comment on each PR.
# Scans the base and head of the PR, then `draugr diff --publish` upserts one PR comment.
name: Draugr diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # for the sticky diff comment

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base commit too

      # Scanners the Saga's controls need.
      - uses: aquasecurity/setup-trivy@v0.3.1
      - run: pipx install semgrep
      - run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Install Draugr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.23.0 --repo draugr-dev/draugr -p 'draugr_*_linux_amd64.tar.gz'
          tar -xzf draugr_*_linux_amd64.tar.gz draugr && sudo mv draugr /usr/local/bin/
          draugr version

      # Scan the PR head (the current checkout) and the base commit (via a worktree).
      - name: Scan head
        run: draugr scan draugr-diff.saga.yaml -o head || true
      - name: Scan base
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          cd ../base && draugr scan "$GITHUB_WORKSPACE/draugr-diff.saga.yaml" -o "$GITHUB_WORKSPACE/base" || true

      # Classify new/fixed/unchanged and post the sticky PR comment.
      - name: Diff + comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: draugr diff base/results.sarif head/results.sarif --publish
