# The Saga for the Draugr demo/UAT app. It enables every implemented control against this
# repo (the checkout) plus one intentionally-old container image, and renders + publishes
# reports. See README.md for the guided UAT walkthrough.
release:
  name: draugr-demo
  version: "1.0"

config:
  controllers:
    sca:
      enabled: true # Trivy fs → app/requirements.txt (old, vulnerable deps)
    secrets:
      enabled: true # Gitleaks → app/config.example.pem (planted fake key)
    sast:
      enabled: true # Semgrep → app/app.py (command injection, eval, …)
    iac:
      enabled: true # Trivy config → app/Dockerfile, deploy/pod.yaml
    images:
      enabled: true # Trivy → the component's container image
    licenses:
      enabled: true # Trivy → the licence of every dependency, against the policy below

  # An inventory of everything this release contains, as one document rather than one per
  # repository and image — which is the unit an SBOM is actually asked for.
  sbom:
    enabled: true
    scope: project

  # Who is making the claims in the VEX document, and what they are about. Without these it still
  # produces a valid document, named after the release; a real one would name a party and the
  # identifier a consumer's own SBOM uses.
  vex:
    author: "Draugr demo <demo@example.com>"
    product: "pkg:oci/draugr-dev/draugr-demo"

  # One accepted risk, carrying everything the report and the VEX document need: why, who, when it
  # lapses, and — separately, because it is a machine-readable claim rather than prose — what it
  # means to somebody consuming this product.
  exclude:
    - rules: ["CVE-2018-1000656"]
      reason: >-
        The vulnerable certificate-verification path is never taken: this service pins its
        upstream host and does not accept user-supplied URLs.
      acceptedBy: "demo@example.com"
      expires: "2027-01-01"
      vex:
        status: not_affected
        justification: vulnerable_code_not_in_execute_path

  # Render several formats and deliver them: files locally, plus GitHub code scanning in CI.
  reports:
    - format: sarif
    - format: markdown
    - format: html
    - format: vex # which of the CVEs above actually affect this product
  publishers:
    - kind: file
      dir: ./draugr-out
    - kind: github # no-ops locally; uploads to the Security tab in GitHub Actions

# Two components, not one, because one is not what anyone's project looks like — and because
# the parts of an application are not equally exposed or equally important. `paths` scopes each
# to its own subtree of this repository; files at the repository root come with both, since that
# is where the manifests and the scanners' own configuration live.
#
# The pay-off is in the report: a per-component verdict, and P1–P4 that differ between them for
# the same severity, because exposure and criticality differ.
components:
  - name: api
    # exposure/criticality feed prioritization (P1–P4). Run `draugr classify` to change them.
    exposure: public
    criticality: important
    # Two repositories, because a component is rarely one. Draugr plans a job per repository and
    # runs them concurrently, so this is the shape that exercises per-repository checkout,
    # provenance and caching. In a real project these would be two separate URLs; here they are
    # two subtrees of this one, which produces the same two jobs.
    repositories:
      - url: . # the service itself: dependencies, code, secrets, its Dockerfile
        paths:
          - app
      - url: . # its deployment surface, owned by the same team
        paths:
          - deploy
    images:
      - image: python:3.8-slim # images: old base with known CVEs (Trivy)

  - name: platform
    # The same findings would rank lower here: nothing external reaches it, and an outage is
    # inconvenient rather than lost revenue.
    exposure: internal
    criticality: supporting
    repositories:
      - url: .
        paths:
          - deploy # the Kubernetes manifests (Trivy config → deploy/pod.yaml)
