# A publisher-free Saga used by the diff workflow to scan the base and head of a PR. It's the
# same repo controls as draugr.saga.yaml but WITHOUT publishers (each side is scanned to a local
# -o directory; the diff comment is posted once by `draugr diff --publish`) and without the image
# control (the PR delta is about this repo's code, and it keeps the double scan fast).
release:
  name: draugr-demo
  version: "1.0"
config:
  controllers:
    sca:
      enabled: true
    secrets:
      enabled: true
    sast:
      enabled: true
    iac:
      enabled: true
components:
  - name: api
    exposure: public
    criticality: important
    repositories:
      - url: .
